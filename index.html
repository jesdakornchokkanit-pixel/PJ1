<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AR Gear Lab</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #top { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20; width: min(92vw, 520px);
    padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,.68); color: #fff; text-align: center; font-size: 14px; line-height: 1.4; }
  #top small { display: block; opacity: .8; font-size: 12px; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(0,0,0,.62); display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin: 0 auto; border-radius: 14px 14px 0 0; }
  #info { color: #fff; font-size: 13px; text-align: center; }
  #chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chip { flex: 0 0 auto; min-height: 36px; padding: 6px 12px; border-radius: 18px; border: 2px solid transparent; background: #37474f; color: #fff; font-size: 13px; font-weight: 600; }
  .chip.sel { border-color: #ffd54f; background: #546e7a; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button { min-height: 46px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; background: #fff; color: #111; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); }
  button:focus-visible, select:focus-visible { outline: 3px solid #ffd54f; outline-offset: 2px; }
  .add { background: #69f0ae; } .del { background: #ff8a80; } .acc { background: #ffd54f; }
  select { min-height: 46px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 700; padding: 0 6px; background: #e0e0e0; color: #111; }
  .wide { grid-column: span 2; }
</style>
<script>
AFRAME.registerComponent('gear-train', {
  init() {
    const T = AFRAME.THREE;
    this.T = T;
    this.M = 0.03;           // module: tooth size (all gears share it so they mesh)
    this.MAX = 12;
    this.root = new T.Group();
    this.root.rotation.x = -Math.PI / 2;   // gear plane lies flat on the marker
    this.root.position.y = 0.05;
    this.el.object3D.add(this.root);
    this.gears = [];
    this.angle = 0;          // degrees, driver (first) gear
    this.speed = 90;         // degrees per second
    this.dir = -1;           // -1 = clockwise (from above)
    this.running = true;
    this.selected = 0;
    this.offset = 0;
    this.colors = [0x1976d2, 0xff9800, 0x43a047, 0xe53935, 0x8e24aa, 0x00acc1, 0xfdd835, 0x6d4c41];
    this.colorI = 0;
    [16, 10, 14].forEach(n => this.add(n, true));
    this.layout();
    this.notify();
  },

  geometry(N) {
    const T = this.T, m = this.M, p = 2 * Math.PI / N;
    const r = m * N / 2, ro = r + m, rr = r - 1.15 * m;
    const tooth = [[-0.5, rr], [-0.27, rr], [-0.15, ro], [0.15, ro], [0.27, rr]];
    const s = new T.Shape();
    let first = true;
    for (let i = 0; i < N; i++) {
      for (const [f, rad] of tooth) {
        const a = (i + f) * p, x = Math.cos(a) * rad, y = Math.sin(a) * rad;
        if (first) { s.moveTo(x, y); first = false; } else s.lineTo(x, y);
      }
    }
    s.closePath();
    const hole = new T.Path();
    hole.absarc(0, 0, Math.max(0.025, rr * 0.28), 0, Math.PI * 2, true);
    s.holes.push(hole);
    return new T.ExtrudeGeometry(s, { depth: 0.1, bevelEnabled: false, curveSegments: 8 });
  },

  add(teeth, silent) {
    if (this.gears.length >= this.MAX) return false;
    const T = this.T;
    const mat = new T.MeshStandardMaterial({ color: this.colors[this.colorI++ % this.colors.length], metalness: 0.3, roughness: 0.55 });
    const mesh = new T.Mesh(this.geometry(teeth), mat);
    this.root.add(mesh);
    this.gears.push({ teeth, r: this.M * teeth / 2, mesh });
    this.selected = this.gears.length - 1;
    if (!silent) { this.layout(); this.notify(); }
    return true;
  },

  remove(index) {
    if (this.gears.length <= 1 || index < 0 || index >= this.gears.length) return false;
    const g = this.gears.splice(index, 1)[0];
    this.root.remove(g.mesh);
    g.mesh.geometry.dispose();
    g.mesh.material.dispose();
    this.selected = Math.min(index, this.gears.length - 1);
    this.layout();
    this.notify();
    return true;
  },

  select(i) { this.selected = i; this.layout(); this.notify(); },

  layout() {
    let x = 0, prev = null;
    this.gears.forEach(g => {
      if (prev) x += prev.r + g.r;
      g.mesh.position.set(x, 0, 0);
      prev = g;
    });
    const last = this.gears[this.gears.length - 1];
    const width = x + this.gears[0].r + last.r + 2 * this.M;
    const first = this.gears[0];
    const left = -first.r - this.M;
    this.scaleK = Math.min(1, 1.7 / width);
    this.root.scale.setScalar(this.scaleK);
    this.centerX = -(left + (left + width)) / 2;
    this.applyOffset();
    this.gears.forEach((g, i) => g.mesh.material.emissive.setHex(i === this.selected ? 0x554400 : 0x000000));
  },

  applyOffset() { this.root.position.x = (this.centerX * this.scaleK) + this.offset; },

  move(dx) { this.offset = Math.max(-1, Math.min(1, this.offset + dx)); this.applyOffset(); },

  notify() { this.el.emit('train-changed'); },

  tick(_t, dt) {
    if (!dt) return;
    if (this.running) this.angle = (this.angle + this.dir * this.speed * dt / 1000) % 360;
    let prevTheta = 0, prevN = 0;
    this.gears.forEach((g, i) => {
      // Meshing condition: tooth of one gear always faces a gap of the next.
      const theta = i === 0 ? this.angle : 180 - 180 / g.teeth - prevTheta * prevN / g.teeth;
      g.mesh.rotation.z = theta * Math.PI / 180;
      prevTheta = theta; prevN = g.teeth;
    });
  }
});

window.addEventListener('DOMContentLoaded', () => {
  const $ = s => document.querySelector(s);
  const scene = $('a-scene'), marker = $('#hiro'), top = $('#top');
  const chips = $('#chips'), info = $('#info'), teethSel = $('#teeth');
  let gt = null;

  marker.addEventListener('markerFound', () => { top.innerHTML = 'พบ Hiro Marker แล้ว<small>เฟืองพร้อมใช้งาน ใช้ปุ่มด้านล่างควบคุมได้เลย</small>'; });
  marker.addEventListener('markerLost', () => { top.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<small>ให้เห็นกรอบดำครบทั้งสี่ด้าน และมีแสงเพียงพอ</small>'; });

  const render = () => {
    chips.innerHTML = '';
    gt.gears.forEach((g, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (i === gt.selected ? ' sel' : '');
      b.textContent = `เฟือง ${i + 1} (${g.teeth} ฟัน)`;
      b.addEventListener('click', () => gt.select(i));
      chips.appendChild(b);
    });
    info.textContent = `เฟือง ${gt.gears.length}/${gt.MAX} • ความเร็ว ${gt.speed}°/วินาที • ${gt.running ? (gt.dir < 0 ? 'หมุนขวา' : 'หมุนซ้าย') : 'หยุด'}`;
    $('#run').textContent = gt.running ? 'หยุด' : 'เริ่ม';
  };

  const bind = (id, fn) => $(id).addEventListener('click', () => { if (gt) { fn(gt); render(); } });

  scene.addEventListener('loaded', () => {
    gt = $('#train').components['gear-train'];
    $('#train').addEventListener('train-changed', render);
    render();
  });

  bind('#add', g => g.add(parseInt(teethSel.value, 10)));
  bind('#del', g => g.remove(g.selected));
  bind('#clear', g => { while (g.gears.length > 1) g.remove(g.gears.length - 1); });
  bind('#faster', g => { g.speed = Math.min(720, g.speed + 30); });
  bind('#slower', g => { g.speed = Math.max(0, g.speed - 30); });
  bind('#run', g => { g.running = !g.running; });
  bind('#dir', g => { g.dir *= -1; g.running = true; });
  bind('#left', g => g.move(-0.1));
  bind('#right', g => g.move(0.1));
});
</script>
</head>
<body>
<div id="top">เล็งกล้องไปที่ Hiro Marker<small>อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</small></div>

<div id="panel">
  <div id="info">กำลังโหลด…</div>
  <div id="chips" aria-label="รายการเฟือง"></div>
  <div id="grid">
    <select id="teeth" aria-label="จำนวนฟันของเฟืองใหม่">
      <option value="8">8 ฟัน</option><option value="10">10 ฟัน</option><option value="12">12 ฟัน</option>
      <option value="14">14 ฟัน</option><option value="16" selected>16 ฟัน</option><option value="20">20 ฟัน</option><option value="24">24 ฟัน</option>
    </select>
    <button id="add" class="add" type="button">+ เพิ่มเฟือง</button>
    <button id="del" class="del" type="button">ลบที่เลือก</button>
    <button id="clear" class="del" type="button">ลบทั้งหมด</button>
    <button id="slower" type="button">ช้าลง −</button>
    <button id="faster" type="button">เร็วขึ้น +</button>
    <button id="run" class="acc" type="button">หยุด</button>
    <button id="dir" class="acc" type="button">กลับทิศ ⇄</button>
    <button id="left" class="wide" type="button">◀ ย้ายซ้าย</button>
    <button id="right" class="wide" type="button">ย้ายขวา ▶</button>
  </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
  arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false">
  <a-marker id="hiro" preset="hiro" emitevents="true" smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="3">
    <a-entity id="train" gear-train></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
